flutter_native_splash:
  # خلفية السبلاش — نفس splash_background بأندرويد (AppColors.bgBrand)
  color: "#0D3A2F"
  color_dark: "#0D3A2F"

  # شعار التطبيق — يُستبدل الملف وحده (راجع assets/images/brand/README.md)
  image: assets/images/brand/app_logo.png
  image_dark: assets/images/brand/app_logo.png

  # Android 12+ (Splash API الجديد)
  android_12:
    image: assets/images/brand/app_logo.png
    icon_background_color: "#FFFFFF"
    image_dark: assets/images/brand/app_logo.png
    icon_background_color_dark: "#121212"

  # ⛔ **أندرويد لا يُولَّد — بقرار.** موردا أندرويد (`splash_logo_full.xml` و
  # `splash_icon_v31.xml`) يُولَّدان بـ`scripts/gen_splash_assets.dart`، وملفّات
  # `styles.xml` الأربعة تُحرَّر باليد. وإعادةُ التوليد من هنا **تمحوها**.
  #
  # وأسبابُ ذلك خمسةٌ مقيسة — راجع `readme/23_STARTUP_SPLASH.md` §٣.
  android: false
  ios: true
  web: false
