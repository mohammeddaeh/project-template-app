name: kit_contracts
description: What the app knows of a device kit — contracts and result types, no platform code.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

# Flutter for the `Widget` type alone — a camera or video surface is drawn by the
# platform, and the app places it. No plugin, ever: that is what a kit is for.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
